name: Build Stark Fit APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.1.0

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > ./StarkFit_APK_Final/local.properties

      - name: Make gradlew executable
        run: chmod +x ./StarkFit_APK_Final/gradlew

      - name: Generate Wrapper + Build APK
        working-directory: ./StarkFit_APK_Final
        run: |
          gradle wrapper --gradle-version 8.1.0
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StarkFit-APK
          path: StarkFit_APK_Final/app/build/outputs/apk/debug/app-debug.apk
