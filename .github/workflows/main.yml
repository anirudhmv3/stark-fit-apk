name: Build Stark Fit APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Make gradlew executable
        run: chmod +x ./StarkFit_APK_Final/gradlew

      - name: Generate Wrapper
        working-directory: ./StarkFit_APK_Final
        run: gradle wrapper --gradle-version 8.1.0

      - name: Build APK
        working-directory: ./StarkFit_APK_Final
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarkFit-APK
          path: StarkFit_APK_Final/app/build/outputs/apk/debug/app-debug.apk
